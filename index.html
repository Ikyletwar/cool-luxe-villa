<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rumah Impian — Cool Luxe Villa</title>
<style>
  :root {
    --bone: #E8E4DC;
    --graphite: #4A4A4D;
    --chrome: #C0C4C8;
    --ink: #0B1020;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    color: #F4F1E9;
  }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 48%, rgba(0,0,0,0.28) 100%);
  }

  .title-card {
    position: absolute;
    top: clamp(18px, 3.2vw, 38px);
    left: clamp(18px, 3.2vw, 42px);
    padding: clamp(14px, 1.6vw, 20px) clamp(16px, 2vw, 26px);
    border-radius: 14px;
    background: rgba(11, 16, 32, 0.34);
    border: 1px solid rgba(232, 228, 220, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    animation: rise 1.1s cubic-bezier(.22,.8,.25,1) both;
  }
  .eyebrow {
    font-size: clamp(8px, 0.75vw, 10px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(232, 228, 220, 0.62);
    margin-bottom: 7px;
  }
  .title-card h1 {
    margin: 0;
    font-size: clamp(16px, 1.55vw, 23px);
    font-weight: 500;
    letter-spacing: 0.015em;
    line-height: 1.2;
    color: #F7F4EC;
  }
  .title-card h1 span { color: #C8C2B4; font-weight: 300; }
  .rule {
    width: 42px;
    height: 1px;
    margin: 12px 0 9px;
    background: linear-gradient(90deg, #C0C4C8, rgba(192,196,200,0));
  }
  .title-card p {
    margin: 0;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(232, 228, 220, 0.52);
  }

  .phase-card {
    position: absolute;
    top: clamp(18px, 3.2vw, 38px);
    right: clamp(18px, 3.2vw, 42px);
    min-width: 128px;
    padding: 13px 16px 14px;
    border-radius: 14px;
    background: rgba(11, 16, 32, 0.34);
    border: 1px solid rgba(232, 228, 220, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    animation: rise 1.1s 0.12s cubic-bezier(.22,.8,.25,1) both;
  }
  .phase-label {
    font-size: 8px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(232, 228, 220, 0.5);
    margin-bottom: 8px;
  }
  .phase-row { display: flex; align-items: center; gap: 9px; }
  .phase-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #FFD27A;
    box-shadow: 0 0 12px currentColor;
    transition: background 1.2s ease, box-shadow 1.2s ease;
  }
  #phaseName {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #F7F4EC;
    transition: color 1.2s ease;
  }
  .phase-track {
    position: relative;
    margin-top: 12px;
    height: 2px;
    border-radius: 2px;
    background: rgba(232, 228, 220, 0.14);
    overflow: hidden;
  }
  .phase-track i {
    position: absolute; inset: 0 auto 0 0;
    width: 0%;
    background: linear-gradient(90deg, #FFD27A, #FF9E6D, #7C9CFF);
    border-radius: 2px;
  }

  .hint {
    position: absolute;
    left: clamp(18px, 3.2vw, 42px);
    bottom: clamp(18px, 3vw, 34px);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(244, 241, 233, 0.72);
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    animation: rise 1.2s 0.25s cubic-bezier(.22,.8,.25,1) both;
  }
  .hint b { font-weight: 500; color: #F7F4EC; }
  .hint .sep { opacity: 0.35; }
  .hint .key {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #C0C4C8;
    margin-right: 6px;
    vertical-align: middle;
    opacity: 0.8;
  }

  .brand {
    position: absolute;
    right: clamp(18px, 3.2vw, 42px);
    bottom: clamp(18px, 3vw, 34px);
    font-size: 8px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(244, 241, 233, 0.38);
    animation: rise 1.2s 0.3s cubic-bezier(.22,.8,.25,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .title-card { max-width: 62vw; }
    .title-card p { display: none; }
    .phase-card { min-width: 104px; padding: 10px 12px 11px; }
    .brand { display: none; }
    .hint { max-width: 78vw; flex-wrap: wrap; row-gap: 4px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>
<div class="hud">
  <div class="title-card">
    <div class="eyebrow">Architectural Study · 01</div>
    <h1>Rumah Impian <span>— Cool Luxe Villa</span></h1>
    <div class="rule"></div>
    <p>Two-storey minimalist villa · low-poly</p>
  </div>

  <div class="phase-card">
    <div class="phase-label">Light Cycle · 30s</div>
    <div class="phase-row">
      <span class="phase-dot" id="phaseDot"></span>
      <span id="phaseName">Day</span>
    </div>
    <div class="phase-track"><i id="phaseFill"></i></div>
  </div>

  <div class="hint">
    <span><span class="key"></span><b>Drag</b> to orbit</span>
    <span class="sep">·</span>
    <span><b>Scroll</b> to zoom</span>
    <span class="sep">·</span>
    <span><b>Right-drag</b> to pan</span>
  </div>
  <div class="brand">Cool Luxe · Low-Poly Series</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

/* ============================================================
   SCENE / CAMERA / CONTROLS
   ============================================================ */
const scene = new THREE.Scene();
const skyColor = new THREE.Color(0x87CEEB);
scene.background = skyColor;
const fog = new THREE.Fog(0x87CEEB, 52, 132);
scene.fog = fog;

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  400
);
camera.position.set(18, 14, 20);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;
controls.panSpeed = 0.8;
controls.minDistance = 7;
controls.maxDistance = 72;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ============================================================
   PALETTE / MATERIALS
   ============================================================ */
const std = (color, roughness = 0.9, metalness = 0.0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, flatShading: true, ...extra });

const M = {
  wall:        std(0xE8E4DC, 0.95, 0.0),
  wallDim:     std(0xD6D0C5, 0.96, 0.0),
  concrete:    std(0xC2BDB2, 0.93, 0.0),
  concreteDim: std(0x9F9A90, 0.96, 0.0),
  graphite:    std(0x4A4A4D, 0.74, 0.18),
  graphiteDk:  std(0x2C2C30, 0.68, 0.22),
  marble:      std(0x1C1C1E, 0.22, 0.38),
  chrome:      std(0xC0C4C8, 0.18, 0.95),
  steel:       std(0x7C8084, 0.36, 0.85),
  wood:        std(0x3B2A20, 0.78, 0.04),
  woodMid:     std(0x5A4030, 0.8, 0.03),
  fabric:      std(0x55555A, 0.98, 0.0),
  fabricLight: std(0xC7C1B5, 0.98, 0.0),
  rug:         std(0xB5AFA3, 1.0, 0.0),
  rugDark:     std(0x6E6A64, 1.0, 0.0),
  lawn:        std(0x60734F, 1.0, 0.0),
  foliage:     std(0x4F6B4A, 1.0, 0.0),
  foliageLt:   std(0x607D58, 1.0, 0.0),
  foliageDk:   std(0x3F593C, 1.0, 0.0),
  screen:      std(0x0A0A0C, 0.42, 0.12),
  ceramic:     std(0xF2EFE8, 0.36, 0.02, { side: THREE.DoubleSide }),
  water:       std(0x2A3238, 0.18, 0.35),
  warmMetal:   std(0x8A7256, 0.35, 0.7),
  glass: new THREE.MeshStandardMaterial({
    color: 0xA8C0C8,
    transparent: true,
    opacity: 0.35,
    roughness: 0.08,
    metalness: 0.05,
    flatShading: true,
    side: THREE.DoubleSide,
    depthWrite: false
  }),
  glassDark: new THREE.MeshStandardMaterial({
    color: 0x6F8388,
    transparent: true,
    opacity: 0.5,
    roughness: 0.12,
    metalness: 0.15,
    flatShading: true,
    side: THREE.DoubleSide,
    depthWrite: false
  }),
  bulb: std(0xFFE6C4, 0.5, 0.0, {
    emissive: new THREE.Color(0xFFB066),
    emissiveIntensity: 0.15
  }),
  windowGlow: new THREE.MeshBasicMaterial({
    color: 0xFFB877,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
    fog: false
  })
};

/* ============================================================
   WORLD GROUP / GEOMETRY HELPERS
   ============================================================ */
const world = new THREE.Group();
scene.add(world);

const boxCache = new Map();
function boxGeo(w, h, d) {
  const key = w.toFixed(3) + '|' + h.toFixed(3) + '|' + d.toFixed(3);
  let g = boxCache.get(key);
  if (!g) { g = new THREE.BoxGeometry(w, h, d); boxCache.set(key, g); }
  return g;
}

function box(w, h, d, mat, x, y, z, parent = world, opts = {}) {
  const m = new THREE.Mesh(boxGeo(w, h, d), mat);
  m.position.set(x, y, z);
  if (opts.ry) m.rotation.y = opts.ry;
  if (opts.rx) m.rotation.x = opts.rx;
  if (opts.rz) m.rotation.z = opts.rz;
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  parent.add(m);
  return m;
}

const cylCache = new Map();
function cyl(rt, rb, h, seg, mat, x, y, z, parent = world, opts = {}) {
  const key = [rt, rb, h, seg].map(v => v.toFixed(3)).join('|');
  let g = cylCache.get(key);
  if (!g) { g = new THREE.CylinderGeometry(rt, rb, h, seg); cylCache.set(key, g); }
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  if (opts.rx) m.rotation.x = opts.rx;
  if (opts.rz) m.rotation.z = opts.rz;
  if (opts.ry) m.rotation.y = opts.ry;
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  parent.add(m);
  return m;
}

const sphCache = new Map();
function sphere(r, ws, hs, mat, x, y, z, parent = world, opts = {}) {
  const key = [r, ws, hs].join('|');
  let g = sphCache.get(key);
  if (!g) { g = new THREE.SphereGeometry(r, ws, hs); sphCache.set(key, g); }
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  if (opts.sx || opts.sy || opts.sz) m.scale.set(opts.sx || 1, opts.sy || 1, opts.sz || 1);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  parent.add(m);
  return m;
}

function glassPanel(w, h, d, x, y, z, parent = world, opts = {}) {
  const m = new THREE.Mesh(boxGeo(w, h, d), opts.dark ? M.glassDark : M.glass);
  m.position.set(x, y, z);
  if (opts.ry) m.rotation.y = opts.ry;
  m.castShadow = false;
  m.receiveShadow = false;
  m.renderOrder = 3;
  parent.add(m);
  return m;
}

/* ============================================================
   SITE / GROUND
   ============================================================ */
const lawn = new THREE.Mesh(new THREE.CircleGeometry(96, 64), M.lawn);
lawn.rotation.x = -Math.PI / 2;
lawn.position.y = -0.03;
lawn.receiveShadow = true;
world.add(lawn);

// stone terrace pad under the villa
box(17.4, 0.1, 13.6, M.concrete, 0, 0.0, -0.15, world, { cast: false });
box(17.9, 0.16, 14.1, M.concreteDim, 0, -0.09, -0.15, world, { cast: false });

// entry walkway + driveway
box(1.9, 0.09, 10.5, M.concrete, 0, 0.035, 10.6, world, { cast: false });
box(6.8, 0.09, 13.0, M.concrete, 12.1, 0.035, 11.6, world, { cast: false });
box(6.0, 0.09, 4.2, M.concrete, 12.1, 0.04, 4.1, world, { cast: false });

// long low planter walls
box(0.5, 0.55, 3.4, M.concrete, -8.6, 0.28, 3.6);
box(3.6, 0.55, 0.5, M.concrete, -6.4, 0.28, -6.6);
box(0.5, 0.55, 2.6, M.concrete, 8.4, 0.28, -4.4);

/* ============================================================
   HOUSE SHELL — floors, walls, glass, roof
   Footprint: x [-7, 7], z [-5, 5]. Ground 0–3.3, upper 3.3–6.4.
   ============================================================ */

// plinth + walnut ground floor
box(14.3, 0.16, 10.3, M.concreteDim, 0, 0.08, 0, world, { cast: false });
box(14.0, 0.08, 10.0, M.wood, 0, 0.12, 0, world, { cast: false });

// upper slab (main volume + rear stair landing)
box(11.8, 0.24, 10.0, M.wall, 1.1, 3.18, 0);
box(11.6, 0.03, 9.8, M.wood, 1.1, 3.315, 0, world, { cast: false });
box(2.2, 0.24, 1.02, M.wall, -5.9, 3.18, -4.29);
box(2.1, 0.03, 0.92, M.wood, -5.9, 3.315, -4.29, world, { cast: false });

// slab fascia at the south glass line
box(11.9, 0.22, 0.24, M.graphite, 1.1, 3.18, 5.02);

// ---- exterior solid walls ----
box(0.22, 6.4, 10.0, M.wall, 7.0, 3.2, 0);                    // east
box(1.3, 6.4, 2.4, M.concrete, 7.65, 3.2, -3.8);              // exposed east service volume
box(1.45, 0.2, 2.55, M.concreteDim, 7.65, 6.5, -3.8);
glassPanel(0.05, 1.9, 0.32, 8.31, 3.3, -3.8, world, { dark: true });
const eastVolumeGlow = new THREE.Mesh(boxGeo(0.02, 1.8, 0.26), M.windowGlow);
eastVolumeGlow.position.set(8.33, 3.3, -3.8);
world.add(eastVolumeGlow);

// south-facing slit on the service volume, read from the carport
glassPanel(0.34, 2.1, 0.05, 7.65, 3.6, -2.585, world, { dark: true });
box(0.46, 0.06, 0.09, M.chrome, 7.65, 4.68, -2.585);
box(0.46, 0.06, 0.09, M.chrome, 7.65, 2.52, -2.585);
const eastSlitGlow = new THREE.Mesh(boxGeo(0.26, 1.94, 0.02), M.windowGlow);
eastSlitGlow.position.set(7.65, 3.6, -2.57);
world.add(eastSlitGlow);
box(6.5, 6.4, 0.22, M.wall, 3.75, 3.2, -5.0);                 // north (kitchen/office)
box(1.0, 6.4, 0.22, M.concrete, 0.0, 3.2, -5.0);              // north spine
box(2.0, 6.4, 0.22, M.wall, -6.0, 3.2, -5.0);                 // north (stair hall)
box(0.28, 6.4, 0.9, M.concrete, -7.04, 3.2, -4.55);           // west concrete blade

// exposed concrete volume to the rear (bathroom / service), split around the garden door
box(1.7, 6.55, 1.3, M.concrete, -4.15, 3.275, -5.65);   // left pier
box(1.4, 6.55, 1.3, M.concrete, -1.2, 3.275, -5.65);    // right pier
box(4.5, 3.95, 1.3, M.concrete, -2.75, 4.575, -5.65);   // lintel
box(4.7, 0.18, 1.5, M.concreteDim, -2.75, 6.52, -5.65);

// ---- rear garden door: glazed slider through the concrete volume ----
box(1.66, 0.12, 1.5, M.concreteDim, -2.6, 0.06, -5.7, world, { cast: false });  // threshold
box(1.6, 0.1, 0.22, M.chrome, -2.6, 2.56, -6.29);       // head track
box(1.6, 0.08, 0.22, M.graphite, -2.6, 0.16, -6.29, world, { cast: false });
for (const x of [-3.34, -1.86]) box(0.1, 2.52, 0.22, M.chrome, x, 1.32, -6.29);
for (const [x, z] of [[-2.96, -6.33], [-2.24, -6.27]]) {
  box(0.72, 2.34, 0.04, M.glass, x, 1.36, z);
  box(0.05, 2.38, 0.07, M.graphite, x - 0.37, 1.36, z);
  box(0.05, 2.38, 0.07, M.graphite, x + 0.37, 1.36, z);
  box(0.72, 0.05, 0.07, M.graphite, x, 2.53, z);
  box(0.72, 0.06, 0.07, M.graphite, x, 0.22, z);
}
box(0.03, 0.46, 0.05, M.chrome, -1.93, 1.2, -6.22);
const doorGlowMat = new THREE.MeshBasicMaterial({
  color: 0xFFC98A,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide,
  fog: false
});
const rearDoorGlow = new THREE.Mesh(boxGeo(1.14, 2.1, 0.02), doorGlowMat);
rearDoorGlow.position.set(-2.6, 1.37, -6.365);
world.add(rearDoorGlow);

// exterior sconce beside the garden door
cyl(0.075, 0.075, 0.24, 6, M.graphite, -1.58, 2.9, -6.4);
box(0.11, 0.03, 0.11, M.bulb, -1.58, 2.77, -6.4, world, { cast: false });

// ---- roof: flat slab with a slight overhang ----
box(15.2, 0.3, 12.4, M.wall, 0, 6.55, -0.65);
box(15.24, 0.2, 0.18, M.graphite, 0, 6.4, 5.56);
box(15.24, 0.2, 0.18, M.graphite, 0, 6.4, -6.86);
box(0.18, 0.2, 12.4, M.graphite, 7.61, 6.4, -0.65);
box(0.18, 0.2, 12.4, M.graphite, -7.61, 6.4, -0.65);

// roof plant / skylight volume
box(1.7, 0.5, 1.3, M.concrete, 4.6, 6.95, -1.6);
glassPanel(1.3, 0.06, 0.9, 4.6, 7.21, -1.6);

// ---- south glass facade ----
glassPanel(13.9, 6.26, 0.07, 0, 3.25, 4.985);
for (const x of [-7, -4.8, -2.4, 0, 2.4, 4.8, 7]) {
  box(0.13, 6.4, 0.13, M.chrome, x, 3.2, 5.02);
}
box(14.0, 0.13, 0.13, M.chrome, 0, 3.32, 5.02);
box(14.0, 0.16, 0.16, M.graphite, 0, 0.16, 5.02);
box(14.0, 0.1, 0.1, M.chrome, 0, 6.34, 5.02);

// pivot entry door within the glass facade
box(1.22, 2.94, 0.1, M.graphite, -1.2, 1.59, 5.035);
box(1.06, 2.76, 0.035, M.glassDark, -1.2, 1.58, 5.09);
cyl(0.022, 0.022, 0.62, 6, M.chrome, -0.72, 1.35, 5.12);
box(2.1, 0.12, 1.1, M.concrete, -1.2, 0.07, 5.62, world, { cast: false });
box(2.4, 0.08, 1.4, M.concreteDim, -1.2, 0.02, 5.75, world, { cast: false });

// thin roof seams to read the flat roof at a distance
for (const x of [-4.4, 0.0, 4.4]) {
  box(0.035, 0.015, 11.9, M.concreteDim, x, 6.71, -0.65, world, { cast: false });
}

// ---- west glass facade ----
glassPanel(0.07, 6.26, 9.7, -6.985, 3.25, 0);
for (const z of [-5, -2.5, 0, 2.5, 5]) {
  box(0.13, 6.4, 0.13, M.chrome, -7.02, 3.2, z);
}
box(0.13, 0.13, 10.0, M.chrome, -7.02, 3.32, 0);

/* ============================================================
   PROPERTY BOUNDARY — concrete posts, walnut slats, two gates
   ============================================================ */
const fenceUnit = new THREE.BoxGeometry(1, 1, 1);
const fencePostMats = [];
const fenceBaseMats = [];
const fenceSlatMats = [];
const fenceDummy = new THREE.Object3D();
const fencePostKeys = new Set();

function fenceMatrix(list, x, y, z, sx, sy, sz) {
  fenceDummy.position.set(x, y, z);
  fenceDummy.rotation.set(0, 0, 0);
  fenceDummy.scale.set(sx, sy, sz);
  fenceDummy.updateMatrix();
  list.push(fenceDummy.matrix.clone());
}

function fencePost(x, z) {
  const key = x.toFixed(2) + '|' + z.toFixed(2);
  if (fencePostKeys.has(key)) return;
  fencePostKeys.add(key);
  fenceMatrix(fencePostMats, x, 0.85, z, 0.26, 1.7, 0.26);
  fenceMatrix(fenceBaseMats, x, 1.725, z, 0.34, 0.05, 0.34);
}

function fenceRun(x0, z0, x1, z1, skipStart = false, skipEnd = false) {
  const horizontal = Math.abs(x1 - x0) > Math.abs(z1 - z0);
  const length = horizontal ? Math.abs(x1 - x0) : Math.abs(z1 - z0);
  const bays = Math.max(1, Math.ceil(length / 2.7));
  const bay = length / bays;
  const dir = horizontal ? Math.sign(x1 - x0) : Math.sign(z1 - z0);
  const rows = [0.38, 0.64, 0.90, 1.16, 1.42];

  for (let i = 0; i <= bays; i++) {
    if ((i === 0 && skipStart) || (i === bays && skipEnd)) continue;
    const d = i * bay;
    fencePost(horizontal ? x0 + dir * d : x0, horizontal ? z0 : z0 + dir * d);
  }

  for (let i = 0; i < bays; i++) {
    const c = (i + 0.5) * bay;
    const cx = horizontal ? x0 + dir * c : x0;
    const cz = horizontal ? z0 : z0 + dir * c;
    const inner = bay - 0.3;
    if (horizontal) {
      fenceMatrix(fenceBaseMats, cx, 0.12, cz, bay, 0.24, 0.34);
      for (const y of rows) fenceMatrix(fenceSlatMats, cx, y, cz, inner, 0.16, 0.06);
    } else {
      fenceMatrix(fenceBaseMats, cx, 0.12, cz, 0.34, 0.24, bay);
      for (const y of rows) fenceMatrix(fenceSlatMats, cx, y, cz, 0.06, 0.16, inner);
    }
  }
}

function buildFenceInstances(list, mat) {
  const mesh = new THREE.InstancedMesh(fenceUnit, mat, list.length);
  list.forEach((m, i) => mesh.setMatrixAt(i, m));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  mesh.instanceMatrix.needsUpdate = true;
  world.add(mesh);
  return mesh;
}

const starCount = 700;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 0.92);
  const r = 115;
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = r * Math.cos(phi) + 6;
  starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({
  color: 0xEAF2FF,
  size: 1.3,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0,
  depthWrite: false,
  fog: false
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// warm interior lights
const interiorLights = [];
function addInteriorLight(x, y, z, base, distance = 16, color = 0xFFB066) {
  const l = new THREE.PointLight(color, 0, distance, 2);
  l.position.set(x, y, z);
  l.castShadow = false;
  scene.add(l);
  interiorLights.push({ light: l, base });
}
addInteriorLight(-3.8, 2.55, 3.2, 22);
addInteriorLight(3.9, 2.1, 3.0, 18);
addInteriorLight(3.6, 2.2, -2.0, 18);
addInteriorLight(-5.8, 2.2, -1.2, 11);
addInteriorLight(-2.5, 5.3, 3.0, 14);
addInteriorLight(-2.5, 5.2, -2.2, 12);
addInteriorLight(4.0, 5.3, 0.0, 16);
addInteriorLight(4.0, 5.3, 3.4, 12);
addInteriorLight(-2.6, 2.3, -4.3, 9, 9);      // hall / garden door
addInteriorLight(-1.58, 2.7, -6.55, 4.5, 5);    // exterior sconce

/* ============================================================
   DAY / SUNSET / NIGHT CYCLE
   ============================================================ */
const CYCLE = 30;
const clock = new THREE.Clock();
const skyStops = [
  [0.00, new THREE.Color(0x87CEEB)],
  [0.28, new THREE.Color(0x8BC7E6)],
  [0.38, new THREE.Color(0xE8A87E)],
  [0.45, new THREE.Color(0xFF9E6D)],
  [0.50, new THREE.Color(0x6A5570)],
  [0.57, new THREE.Color(0x0B1020)],
  [0.86, new THREE.Color(0x0B1020)],
  [0.93, new THREE.Color(0x3B4668)],
  [0.972, new THREE.Color(0xC58F76)],
  [1.00, new THREE.Color(0x87CEEB)]
];
const sunHigh = new THREE.Color(0xFFF4E0);
const sunLow = new THREE.Color(0xFF7A3D);
const tmpColor = new THREE.Color();

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function sampleGradient(stops, t, out) {
  let i = 0;
  while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
  const a = stops[i];
  const b = stops[i + 1];
  const span = Math.max(1e-6, b[0] - a[0]);
  let k = (t - a[0]) / span;
  k = Math.min(1, Math.max(0, k));
  k = k * k * (3 - 2 * k);
  out.copy(a[1]).lerp(b[1], k);
}

const phaseNameEl = document.getElementById('phaseName');
const phaseDotEl = document.getElementById('phaseDot');
const phaseFillEl = document.getElementById('phaseFill');
let lastPhase = '';

function updateCycle(t) {
  // sun path: rises 0.88, sets 0.45 (wrapping)
  const u = t < 0.88 ? t + 1 : t;
  const phase = Math.PI * (u - 0.88) / 0.57;
  const sinP = Math.sin(phase);
  const cosP = Math.cos(phase);

  // sky + fog
  sampleGradient(skyStops, t, skyColor);
  fog.color.copy(skyColor);

  // sun transform
  sun.position.set(-cosP * 52, sinP * 40, 18);
  sun.intensity = 2.4 * smoothstep(-0.04, 0.18, sinP);
  const horizonWarm = 1 - smoothstep(0.04, 0.55, sinP);
  sun.color.copy(sunHigh).lerp(sunLow, horizonWarm);

  // sun disc + halo
  const showSun = sinP > -0.04;
  sunDisc.visible = showSun;
  sunHalo.visible = showSun;
  if (showSun) {
    tmpColor.copy(sunHigh).lerp(sunLow, horizonWarm);
    sunDiscMat.color.copy(tmpColor);
    sunHaloMat.color.copy(tmpColor);
    const dir = sun.position.clone().normalize().multiplyScalar(108);
    sunDisc.position.copy(dir);
    sunHalo.position.copy(dir);
    sunHaloMat.opacity = 0.1 + 0.12 * horizonWarm;
  }

  // ambient / hemisphere
  const dayF = smoothstep(-0.1, 0.22, sinP);
  hemi.intensity = 0.24 + 0.68 * dayF;
  hemi.color.copy(skyColor);
  hemi.groundColor.setHex(0x3F4A38);
  ambient.intensity = 0.09 + 0.19 * dayF;

  // night factor for interior + path lighting
  const nightF = 1 - smoothstep(-0.12, 0.2, sinP);
  moon.intensity = 0.55 * nightF;
  for (const item of interiorLights) {
    item.light.intensity = item.base * nightF;
  }
  for (const l of pathLights) {
    l.intensity = 3.6 * nightF;
  }
  M.bulb.emissiveIntensity = 0.12 + 2.3 * nightF;
  M.windowGlow.opacity = 0.42 * nightF;
  doorGlowMat.opacity = 0.22 * nightF;

  // stars
  starMat.opacity = nightF * 0.85;
  stars.rotation.y = clock.elapsedTime * 0.004;

  // HUD
  let label = 'Day';
  let dot = '#FFD27A';
  if (t >= 0.34 && t < 0.52) { label = 'Sunset'; dot = '#FF9E6D'; }
  else if (t >= 0.52 && t < 0.9) { label = 'Night'; dot = '#7C9CFF'; }
  if (label !== lastPhase) {
    lastPhase = label;
    phaseNameEl.textContent = label;
    phaseDotEl.style.background = dot;
    phaseDotEl.style.boxShadow = '0 0 12px ' + dot;
  }
  phaseFillEl.style.width = (t * 100).toFixed(1) + '%';
}

/* ============================================================
   RESIZE + RENDER LOOP
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  const t = (clock.getElapsedTime() % CYCLE) / CYCLE;
  updateCycle(t);
  controls.update();
  renderer.render(scene, camera);
});
</script>
